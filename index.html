<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Study & Habit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: ใบรายการแบบสมุดจดตารางสอบ. หัวหน้าเป็นหมึกดำ สีสันทั้งหมดมาจากขั้นตอน Pipeline ของหัวข้อ */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --ink:#111827; --muted:#5B6575; --line:#D8DDE5; --track:#E4E8EE;
  --ink-btn:#111827; --on-btn:#FFFFFF; --hover:#EAEEF3; --danger:#B91C1C; --focus:#2563EB;
  --k0:#64748B; --k1:#2563EB; --k2:#B45309; --k3:#15803D; --k4:#7C3AED; --k5:#BE123C; --k6:#0F766E; --k7:#C2410C;
  --onk:#FFFFFF; --warn:#B45309; --on-warn:#FFFFFF; --over:#B91C1C; --on-over:#FFFFFF;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B22; --ink:#E8ECF2; --muted:#9AA5B4; --line:#2A313C; --track:#262D38;
    --ink-btn:#E8ECF2; --on-btn:#0E1116; --hover:#1F2530; --danger:#F87171; --focus:#60A5FA;
    --k0:#94A3B8; --k1:#60A5FA; --k2:#FBBF24; --k3:#4ADE80; --k4:#A78BFA; --k5:#FB7185; --k6:#2DD4BF; --k7:#FB923C;
    --onk:#0B1220; --warn:#FBBF24; --on-warn:#0B1220; --over:#F87171; --on-over:#0B1220; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --ink:#E8ECF2; --muted:#9AA5B4; --line:#2A313C; --track:#262D38;
  --ink-btn:#E8ECF2; --on-btn:#0E1116; --hover:#1F2530; --danger:#F87171; --focus:#60A5FA;
  --k0:#94A3B8; --k1:#60A5FA; --k2:#FBBF24; --k3:#4ADE80; --k4:#A78BFA; --k5:#FB7185; --k6:#2DD4BF; --k7:#FB923C;
  --onk:#0B1220; --warn:#FBBF24; --on-warn:#0B1220; --over:#F87171; --on-over:#0B1220; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.c0{--sc:var(--k0)}.c1{--sc:var(--k1)}.c2{--sc:var(--k2)}.c3{--sc:var(--k3)}.c4{--sc:var(--k4)}.c5{--sc:var(--k5)}.c6{--sc:var(--k6)}.c7{--sc:var(--k7)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn);font-weight:600}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:.85rem}
.btn[aria-disabled="true"]{opacity:.4}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* stacked progress bar */
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--track)}
.bar i{display:block;background:var(--sc);height:100%}
.bar.lg{height:16px}
.pct{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}

/* overview */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.hero .big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .big .pct{font-size:3.4rem;line-height:1}
.hero .big span{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;min-height:34px;font-size:.9rem}
.chip:hover{background:var(--hover)}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sc,var(--ink))}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn)}
.chip[aria-pressed="true"]::before{box-shadow:0 0 0 2px var(--on-btn)}
.sect{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px;gap:10px;flex-wrap:wrap}
.sect h2{font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.scard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.scard:hover{border-color:var(--ink)}
.scard .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.scard .nm{font-weight:600;overflow-wrap:anywhere}
.scard .pct{font-size:1.4rem}
.scard .m{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.m span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:5px}

/* topics view */
.subbar{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto;min-width:0;position:relative}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:38px;max-width:min(240px,100%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addsubj{flex:none;border:1px dashed var(--ink);background:var(--surface);border-radius:8px;padding:6px 14px;min-height:38px;font-weight:600;white-space:nowrap}
.addsubj:hover{background:var(--hover)}
.subtabs button:hover{background:var(--hover)}
.subtabs button[aria-pressed="true"]{background:var(--ink-btn);color:var(--on-btn);border-color:var(--ink-btn);font-weight:600}
.subtabs .add{border-style:dashed}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters .lb{color:var(--muted);font-size:.85rem;margin-right:2px}
.subhead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;margin-bottom:12px}
.subhead .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sname{font-family:var(--f-display);font-weight:600;font-size:1.25rem;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;min-width:0;flex:1 1 180px}
.sname:hover,.sname:focus{border-color:var(--line);background:var(--bg)}
.group{margin-bottom:22px}
.group>h3{font-size:1rem;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.group>h3 .pct{color:var(--muted);font-size:.9rem;font-weight:600}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.topic{display:grid;grid-template-columns:2rem minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.topic.near{background:color-mix(in srgb,var(--warn) 12%,var(--surface));box-shadow:inset 4px 0 0 var(--warn)}
.topic.over{background:color-mix(in srgb,var(--over) 12%,var(--surface));box-shadow:inset 4px 0 0 var(--over)}
.topic .seg{grid-column:2/-1}
.topic:first-child{border-top:0}
.topic .idx{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;font-family:var(--f-display)}
.tname{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;min-width:0;width:100%}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--bg)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:3px 11px;min-height:34px;font-size:.88rem;white-space:nowrap}
.seg button:hover{border-color:var(--sc);color:var(--ink)}
.seg button.on{background:var(--sc);border-color:var(--sc);color:var(--onk);font-weight:600}
.seg button.on::before{content:"\2713\00a0"}
.xbtn{border:0;background:transparent;color:var(--muted);border-radius:6px;min-height:34px;padding:0 10px}
.xbtn:hover{color:var(--danger);background:var(--hover)}
.xbtn[aria-disabled="true"]{opacity:.35}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px}
.hint{color:var(--muted);font-size:.85rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}

/* pipeline view */
.chain{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:10px 0 20px}
.chain .node{background:var(--sc);color:var(--onk);border-radius:8px;padding:4px 12px;font-weight:600;font-size:.9rem}
.chain .arr{color:var(--muted)}
.stage{display:grid;grid-template-columns:auto minmax(150px,1fr) auto auto auto;gap:10px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.stage:first-child{border-top:0}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--sc);padding:0}
.swatches button[aria-checked="true"]{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.stage input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-height:38px;min-width:0;width:100%}
.stage label{display:flex;gap:6px;align-items:center;font-size:.88rem;white-space:nowrap}
.stage input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink-btn)}
.stage .ops{display:flex;gap:4px}
.stage .cnt{color:var(--muted);font-size:.85rem;white-space:nowrap}

/* data view */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;margin-bottom:14px}
.panel h3{font-size:1.05rem}
.panel p{margin:0;color:var(--muted)}
textarea.code{width:100%;min-height:130px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* setup */
.setup h1{font-size:1.7rem;margin-bottom:6px}
.setup .lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.dcard .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dcard input,.dcard textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.dcard textarea{min-height:150px;resize:vertical}
.dcard .no{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.85rem}
.dcount{font-size:.82rem;color:var(--muted)}
.dcount.ok{color:var(--k3)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,100%);display:grid;gap:14px}
.modal h2{font-size:1.15rem}
.modal p{margin:0;color:var(--muted)}
.modal input,.modal select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;min-height:40px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink-btn);color:var(--on-btn);
  border-radius:10px;padding:10px 16px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;padding:0}

@media (max-width:720px){
  .topic{grid-template-columns:2rem minmax(0,1fr) auto}
  .topic .due{grid-column:2/3;grid-row:2}
  .topic .xbtn{grid-column:3;grid-row:1}
  .topic .seg{grid-column:2/-1}
  .tbarw{padding-inline:12px}
  .stage{grid-template-columns:minmax(0,1fr) auto}
  .stage .swatches,.stage input[type=text]{grid-column:1/-1}
  .hero .big .pct{font-size:2.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* หัวข้อย่อย (การ์ด) และ Deadline */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.thead{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.thead .tn{font-family:var(--f-display);font-weight:600;font-size:1.02rem;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;min-width:0;flex:1 1 160px}
.thead .tn:hover,.thead .tn:focus{border-color:var(--line);background:var(--bg)}
.fold{border:0;background:transparent;width:34px;height:34px;border-radius:6px;color:var(--muted);font-size:1rem}
.fold:hover{background:var(--hover)}
.tsum{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tbarw{padding:0 14px 10px}
.tcard .list{border:0;border-top:1px solid var(--line);border-radius:0}
.tempty{padding:12px 16px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.addrow.in{margin:0;padding:10px 12px;border-top:1px solid var(--line)}
.addrow.in input{min-height:36px}
.tlabel{font-family:var(--f-display);font-weight:600;font-size:.92rem;color:var(--muted);margin:10px 2px 6px}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge.near{background:var(--warn);color:var(--on-warn)}
.badge.over{background:var(--over);color:var(--on-over)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.due{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dinput{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 8px;min-height:34px;font-size:.85rem}
.chip.near::before{display:none}
.filters .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.dlbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;display:grid;gap:6px}
.dlbox .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.dlbox h2{font-size:1.05rem}
.dlbox label{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dlbox input[type=number]{width:68px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;min-height:34px}
.dlrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 4px;min-height:44px}
.dlrow:hover{background:var(--hover)}
.dlrow .path{overflow-wrap:anywhere}
.dlrow .path small{color:var(--muted);display:block}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:.88rem;margin:0 0 16px}
.setup code{background:var(--track);border-radius:4px;padding:0 5px}

/* Pomodoro */
.tm{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
.tmcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;justify-items:center}
.ringw{position:relative;width:min(260px,100%);aspect-ratio:1}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .trk{fill:none;stroke:var(--track);stroke-width:12}
.ringw .arc{fill:none;stroke-width:12;stroke-linecap:round}
.ringw.read .arc{stroke:var(--k1)}
.ringw.brk .arc{stroke:var(--k3)}
.ringw.wait .arc{stroke:var(--warn)}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ringc .ph{color:var(--muted);font-weight:600}
.ringc .clock{font-family:var(--f-display);font-weight:700;font-size:3rem;font-variant-numeric:tabular-nums;line-height:1.1}
.ringc .sub{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;min-height:12px}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--k1);border-color:var(--k1)}
.btn.big{min-height:46px;padding:8px 22px;font-size:1.05rem}
.tmctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tmside{display:grid;gap:14px;min-width:0}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.85rem;color:var(--muted)}
.field select,.sg input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-height:40px;width:100%;min-width:0}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sg .field.chk{align-content:end}
.sg .chk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.92rem;min-height:40px}
.sg .chk input{width:18px;height:18px;accent-color:var(--ink-btn)}
.sstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sstat{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sstat b{display:block;font-family:var(--f-display);font-size:1.4rem}
.sstat span{color:var(--muted);font-size:.85rem}
.tscroll{overflow-x:auto}
table.tmt{width:100%;border-collapse:collapse;font-size:.92rem}
.tmt th,.tmt td{padding:7px 8px;text-align:left;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tmt thead th{color:var(--muted);font-weight:500;font-size:.82rem;border-top:0}
.tmt tbody th{font-weight:500}
.tmtag{color:var(--muted);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--warn);color:var(--on-warn);border-radius:12px;padding:12px 16px;margin-top:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.banner.ok{background:var(--k3);color:var(--onk)}
.banner .bt{display:grid;gap:2px;min-width:0}
.banner .bs{font-size:.88rem;opacity:.95}
.banner .btn.primary{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink-btn);color:var(--on-btn);border-radius:99px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);box-shadow:0 6px 24px rgba(0,0,0,.28)}
.mini .t{font-family:var(--f-display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}

<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
var KEY="study-tracker-v2", OLDKEY="study-tracker-v1", TKEY="study-tracker-theme";
var DRAFT_SLOTS=6, MAX_SHOW=8;
var COLOR_NAMES=["เทา","น้ำเงิน","เหลืองส้ม","เขียว","ม่วง","แดงกุหลาบ","เขียวหยก","ส้ม"];
var DEFAULT_STAGES=[
  {id:"s1",name:"ยังไม่อ่าน",color:0,done:false},
  {id:"s2",name:"อ่านแล้ว",color:1,done:false},
  {id:"s3",name:"รอทำควิซ",color:2,done:false},
  {id:"s4",name:"ทำควิซแล้ว",color:3,done:true}
];
var mem={};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return mem[k]===undefined?null:mem[k];}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return "x"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return (n<10?"0":"")+n;}

/* ---------- dates ---------- */
var TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dayNum(str){var p=str.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000;}
function daysUntil(due){return Math.round(dayNum(due)-dayNum(todayStr()));}
function fmtDate(str){var p=str.split("-"),y=+p[0];return (+p[2])+" "+TH_M[+p[1]-1]+(y!==new Date().getFullYear()?" "+(y+543):"");}
function validDate(s){
  if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p=s.split("-"), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  return d.getUTCFullYear()===+p[0]&&d.getUTCMonth()===+p[1]-1&&d.getUTCDate()===+p[2];
}

/* ---------- state ---------- */
function fresh(){return {v:2,setup:false,settings:{warnDays:3,pomo:{read:25,short:5,long:15,every:4,longOn:true}},stages:clone(DEFAULT_STAGES),subjects:[],sessions:[],habits:[]};}
function normalize(o){
  if(!o||typeof o!=="object") throw "ข้อมูลนี้ไม่ใช่ไฟล์ของแอปนี้";
  if(o.v!==2) throw "ไฟล์นี้เป็นรูปแบบเวอร์ชันเก่า (วิชา → หัวข้อ) นำเข้าในเวอร์ชันนี้ไม่ได้";
  var seen={};
  var stages=(Array.isArray(o.stages)?o.stages:[]).map(function(s){
    var id=String(s&&s.id||uid()); if(seen[id]) id=uid(); seen[id]=1;
    return {id:id,name:String(s&&s.name||"").trim()||"ขั้นตอน",color:Math.max(0,Math.min(7,(s&&s.color)|0)),done:!!(s&&s.done)};
  });
  if(stages.length<2) throw "Pipeline ต้องมีอย่างน้อย 2 ขั้นตอน";
  if(!stages.some(function(s){return s.done;})) stages[stages.length-1].done=true;
  var wd=parseInt(o.settings&&o.settings.warnDays,10); if(isNaN(wd)) wd=3; wd=Math.max(0,Math.min(60,wd));
  function cl(v,d,a,b){var n=parseInt(v,10); if(isNaN(n)) n=d; return Math.max(a,Math.min(b,n));}
  var pm=(o.settings&&o.settings.pomo)||{};
  var pomoS={read:cl(pm.read,25,1,180),short:cl(pm.short,5,1,60),long:cl(pm.long,15,1,60),every:cl(pm.every,4,2,12),longOn:pm.longOn!==false};
  var subjects=(Array.isArray(o.subjects)?o.subjects:[]).map(function(s,i){
    var topics=(Array.isArray(s&&s.topics)?s.topics:[]).map(function(t,j){
      var items=(Array.isArray(t&&t.items)?t.items:[]).map(function(it,k){
        var st=stages.some(function(x){return x.id===(it&&it.stage);})?it.stage:stages[0].id;
        return {id:String(it&&it.id||uid()),name:String(it&&it.name||"").trim()||("หัวข้อย่อย 2 ข้อที่ "+(k+1)),stage:st,due:validDate(it&&it.due)?it.due:null};
      });
      return {id:String(t&&t.id||uid()),name:String(t&&t.name||"").trim()||("หัวข้อย่อย "+(j+1)),items:items};
    });
    return {id:String(s&&s.id||uid()),name:String(s&&s.name||"").trim()||("วิชา "+(i+1)),topics:topics};
  });
  var sessions=[];
  (Array.isArray(o.sessions)?o.sessions:[]).forEach(function(x){
    if(!x) return;
    var stt=+x.start, enn=+x.end, hasT=x.start!=null&&x.end!=null&&isFinite(stt)&&stt>0&&isFinite(enn)&&enn>=stt;
    var dt=hasT?dateOf(stt):x.date; if(!validDate(dt)) return;
    var sec=Math.round(+x.sec); if(!(sec>=1&&sec<=86400)) return;
    var sb=subjects.filter(function(q){return q.id===x.s;})[0];
    var tpp=sb&&sb.topics.filter(function(q){return q.id===x.tp;})[0];
    var itt=tpp&&tpp.items.filter(function(q){return q.id===x.it;})[0];
    sessions.push({id:String(x.id||uid()),date:dt,sec:sec,s:sb?sb.id:null,tp:tpp?tpp.id:null,it:itt?itt.id:null,start:hasT?stt:null,end:hasT?enn:null,manual:x.manual===true,paused:x.paused===true});
  });
  return {v:2,setup:true,settings:{warnDays:wd,pomo:pomoS},stages:stages,subjects:subjects,sessions:sessions,habits:normHabits(o.habits)};
}
function normHabits(a){
  var out=[], seen={};
  (Array.isArray(a)?a:[]).forEach(function(h,i){
    if(!h||typeof h!=="object") return;
    var done={}; if(h.done&&typeof h.done==="object") Object.keys(h.done).forEach(function(k){if(validDate(k)&&h.done[k]) done[k]=1;});
    var days=[]; (Array.isArray(h.days)?h.days:[]).forEach(function(d){d=+d; if(d>=0&&d<=6&&d%1===0&&days.indexOf(d)<0) days.push(d);}); days.sort(); if(!days.length) days=[0,1,2,3,4,5,6];
    var c=Math.round(+h.color); if(!(c>=0&&c<=7)) c=1;
    var em=Array.from(String(h.emoji==null?"":h.emoji).trim()).slice(0,2).join("")||"✅";
    var id=String(h.id||uid()); while(seen[id]) id=uid(); seen[id]=1;
    var cr=validDate(h.created)?h.created:null; if(!cr){cr=todayStr(); Object.keys(done).forEach(function(k){if(k<cr) cr=k;});}
    out.push({id:id,name:String(h.name||"").trim().slice(0,60)||("Habit "+(i+1)),emoji:em,color:c,days:days,archived:h.archived===true,created:cr,done:done});
  });
  return out;
}
function load(){
  var raw=lsGet(KEY);
  if(raw){try{return normalize(JSON.parse(raw));}catch(e){}}
  return fresh();
}
var S=load();
function secFromHash(){try{var m=/^#\/(study|habit)\/?$/.exec(location.hash); return m?m[1]:"home";}catch(e){return "home";}}
var U={sec:secFromHash(),view:S.setup?"overview":"setup",subj:"all",filter:"all",near:false,fold:{},modal:null,draft:null};
var undoSnap=null;
function save(){lsSet(KEY,JSON.stringify(S));}

function effTheme(){
  var t=document.documentElement.getAttribute("data-theme"); if(t) return t;
  return (window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
}
(function(){var t=lsGet(TKEY); if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);})();

/* ---------- helpers ---------- */
function stageById(id){return S.stages.filter(function(s){return s.id===id;})[0];}
function itemsOf(sub){var a=[]; sub.topics.forEach(function(t){a=a.concat(t.items);}); return a;}
function allItems(){var a=[]; S.subjects.forEach(function(s){a=a.concat(itemsOf(s));}); return a;}
function stats(items){
  var c={}; S.stages.forEach(function(s){c[s.id]=0;});
  items.forEach(function(t){if(c[t.stage]!==undefined) c[t.stage]++;});
  var done=0; S.stages.forEach(function(s){if(s.done) done+=c[s.id];});
  return {c:c,total:items.length,done:done,pct:items.length?Math.round(done/items.length*100):0};
}
function dueInfo(it){
  if(!it.due) return null;
  var st=stageById(it.stage); if(st&&st.done) return null;
  var d=daysUntil(it.due);
  if(d<0) return {kind:"over",d:d,label:"⚠ เลยมา "+(-d)+" วัน"};
  if(d<=S.settings.warnDays) return {kind:"near",d:d,label:"⏰ "+(d===0?"วันนี้":d===1?"พรุ่งนี้":"อีก "+d+" วัน")};
  return null;
}
function dueCounts(items){var n=0,o=0; items.forEach(function(it){var i=dueInfo(it); if(i){if(i.kind==="over") o++; else n++;}}); return {near:n,over:o};}
function dueBadges(c){
  return (c.over?'<span class="badge over">⚠ เลยกำหนด '+c.over+'</span>':"")+(c.near?'<span class="badge near">⏰ ใกล้กำหนด '+c.near+'</span>':"");
}
function barHtml(st,lg){
  var lab=S.stages.map(function(s){return s.name+" "+st.c[s.id];}).join(", ");
  var segs=S.stages.map(function(s){
    var w=st.total?(st.c[s.id]/st.total*100):0;
    return w>0?'<i class="c'+s.color+'" style="width:'+w+'%"></i>':"";
  }).join("");
  return '<div class="bar'+(lg?" lg":"")+'" role="img" aria-label="'+esc(lab)+'">'+segs+'</div>';
}
function toast(msg,undo){
  var el=$("#toast");
  el.innerHTML="<span>"+esc(msg)+"</span>"+(undo?'<button data-act="undo">เลิกทำ</button>':"");
  el.hidden=false; if(!undo) undoSnap=null;
  clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true;undoSnap=null;},5500);
}
function snapshot(){undoSnap=JSON.stringify(S);}
function findSub(id){return S.subjects.filter(function(s){return s.id===id;})[0];}
function findTopic(sid,tid){var s=findSub(sid); return s&&s.topics.filter(function(t){return t.id===tid;})[0];}
function findItem(sid,tid,iid){var t=findTopic(sid,tid); return t&&t.items.filter(function(i){return i.id===iid;})[0];}
function fmtDur(sec){
  sec=Math.round(sec); if(sec<=0) return "0 น.";
  if(sec<60) return sec+" วิ";
  var m=Math.floor(sec/60), h=Math.floor(m/60);
  return h?(h+" ชม. "+(m%60)+" น."):(m+" น.");
}
function sumSec(f){var n=0; (S.sessions||[]).forEach(function(x){if(f(x)) n+=x.sec;}); return n;}
function secOfItem(id){return sumSec(function(x){return x.it===id;});}
function secOfTopic(id){return sumSec(function(x){return x.tp===id;});}
function secOfSubject(id){return sumSec(function(x){return x.s===id;});}
function secToday(){var t=todayStr(); return sumSec(function(x){return x.date===t;});}
function secAll(){return sumSec(function(){return true;});}
function tmTag(sec){return sec?'<span class="tmtag" title="เวลาอ่านสะสม">⏱ '+fmtDur(sec)+'</span>':"";}
function dateOf(ms){var d=new Date(ms); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function filtered(){return U.filter!=="all"||U.near;}
function visItems(tp){
  var out=[]; tp.items.forEach(function(it,i){
    if((U.filter==="all"||it.stage===U.filter)&&(!U.near||dueInfo(it))) out.push([it,i]);
  }); return out;
}

/* ---------- pomodoro ---------- */
var TKEY2="study-tracker-timer-v1", RING=2*Math.PI*96;
function freshT(){return {phase:"read",status:"idle",durMs:0,accMs:0,segStart:null,endedAt:null,round:0,next:null,lastSeen:0,lastCredit:0,lastLabel:"",note:"",phaseStart:null,paused:false,sel:{s:null,tp:null,it:null}};}
function loadT(){try{var o=JSON.parse(lsGet(TKEY2)); if(o&&typeof o==="object"&&o.sel) return Object.assign(freshT(),o);}catch(e){} return freshT();}
var T=loadT();
function saveT(){lsSet(TKEY2,JSON.stringify(T));}
function pomo(){return S.settings.pomo;}
function phaseMs(ph){var p=pomo(); return (ph==="read"?p.read:ph==="short"?p.short:p.long)*60000;}
function elapsedMs(now){return T.accMs+(T.segStart?Math.max(0,now-T.segStart):0);}
function remainMs(now){
  if(T.status==="idle") return phaseMs("read");
  if(T.status==="waiting") return 0;
  return Math.max(0,T.durMs-elapsedMs(now));
}
function fmtClock(ms){var s=Math.ceil(ms/1000), m=Math.floor(s/60); return pad(m)+":"+pad(s%60);}
function ringOffset(now){
  if(T.status==="idle"||T.status==="waiting"||!T.durMs) return 0;
  return RING*Math.min(1,elapsedMs(now)/T.durMs);
}
function sanitizeSel(){
  var sl=T.sel;
  if(sl.s&&!findSub(sl.s)){T.sel=sl={s:null,tp:null,it:null};}
  if(sl.it&&!findItem(sl.s,sl.tp,sl.it)){sl.it=null; sl.tp=null;}
  return sl;
}
function selLabel(){
  var sl=sanitizeSel(); if(!sl.s) return "ไม่ระบุวิชา";
  var t=findSub(sl.s).name; if(sl.it) t+=" › "+findItem(sl.s,sl.tp,sl.it).name; return t;
}
function startPhase(ph){
  var now=Date.now();
  T.phase=ph; T.durMs=phaseMs(ph); T.accMs=0; T.segStart=now; T.phaseStart=now; T.paused=false; T.status="running"; T.endedAt=null; T.next=null; T.note=""; T.lastSeen=now; saveT();
}
function finishPhase(endedAt,creditMs,endTs){
  var wasRead=T.phase==="read";
  T.status="waiting"; T.endedAt=endedAt; T.segStart=null; T.accMs=0;
  if(wasRead){
    var sec=Math.round(creditMs/1000); T.lastCredit=sec; T.lastLabel=selLabel();
    if(sec>=1){
      var sl=sanitizeSel(), st0=(typeof T.phaseStart==="number"&&T.phaseStart>0)?T.phaseStart:null, en0=endTs||endedAt;
      if(st0&&en0<st0) en0=st0;
      S.sessions.push({id:uid(),date:st0?dateOf(st0):dateOf(endedAt),sec:sec,s:sl.s,tp:sl.tp,it:sl.it,start:st0,end:st0?en0:null,manual:false,paused:!!T.paused}); save();
    }
    T.round++; var p=pomo(); T.next=(p.longOn&&T.round>=p.every)?"long":"short";
  }
  saveT();
  var ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) renderOverlays(); else render();
}
function resetTimer(){T=Object.assign(freshT(),{sel:T.sel}); saveT(); render();}
function tick(){
  var now=Date.now();
  if(T.status==="running"){
    if(elapsedMs(now)>=T.durMs){finishPhase(T.segStart+(T.durMs-T.accMs),T.durMs); return;}
    if(now-T.lastSeen>=1000){T.lastSeen=now; saveT();}
  }
  updateTm(now);
}
function updateTm(now){
  var tn=document.querySelectorAll('[data-tm="time"]'), i;
  var txt=fmtClock(remainMs(now));
  for(i=0;i<tn.length;i++) if(tn[i].textContent!==txt) tn[i].textContent=txt;
  var ov=document.querySelectorAll('[data-tm="over"]'), ot=(T.status==="waiting"&&T.endedAt)?"เกินมา "+fmtClock(Math.max(0,now-T.endedAt)):"";
  for(i=0;i<ov.length;i++) if(ov[i].textContent!==ot) ov[i].textContent=ot;
  var rg=document.querySelectorAll('[data-tm="ring"]');
  for(i=0;i<rg.length;i++) rg[i].setAttribute("stroke-dashoffset",ringOffset(now).toFixed(2));
}

/* ---------- reading log ---------- */
var THDAY=["อา","จ","อ","พ","พฤ","ศ","ส"];
function dayShift(n){var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return dateOf(d.getTime());}
function dateParts(ds){var a=ds.split("-"); return new Date(+a[0],+a[1]-1,+a[2]);}
function dayLabel(ds){
  if(ds===todayStr()) return "วันนี้"; if(ds===dayShift(-1)) return "เมื่อวาน";
  var d=dateParts(ds); return "วัน"+["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)+"/"+(d.getFullYear()+543);
}
function hm(ms){var d=new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes());}
function timeText(x){
  if(!x.start) return "ไม่ทราบเวลาเริ่ม";
  return hm(x.start)+"–"+hm(x.end)+(dateOf(x.end)!==dateOf(x.start)?" (+1)":"");
}
function logWho(x){
  var sb=x.s&&findSub(x.s); if(!sb) return "ไม่ระบุวิชา";
  var t=sb.name, it=x.it&&findItem(x.s,x.tp,x.it); if(it) t+=" › "+it.name; return t;
}
function LG(){return U.log||(U.log={range:"7",subj:"all"});}
function logPass(x,f,useRange){
  if(f.subj==="none"){ if(x.s) return false; } else if(f.subj!=="all"&&x.s!==f.subj) return false;
  if(useRange){
    if(f.range==="1"&&x.date!==todayStr()) return false;
    if(f.range==="7"&&x.date<dayShift(-6)) return false;
    if(f.range==="30"&&x.date<dayShift(-29)) return false;
  }
  return true;
}
function logSort(a,b){
  if(a.date!==b.date) return a.date<b.date?1:-1;
  var as=a.start||0, bs=b.start||0; if(!a.start&&b.start) return 1; if(a.start&&!b.start) return -1;
  return bs-as;
}
function lgSubjOpts(sel,all){
  var o=all?'<option value="all"'+(sel==="all"?" selected":"")+'>ทุกวิชา</option><option value="none"'+(sel==="none"?" selected":"")+'>ไม่ระบุวิชา</option>':'<option value="">ไม่ระบุวิชา</option>';
  return o+S.subjects.map(function(s){return '<option value="'+s.id+'"'+(sel===s.id?" selected":"")+'>'+esc(s.name)+'</option>';}).join("");
}
function lgItemOpts(sid,sel){
  var o='<option value="">ไม่ระบุหัวข้อย่อย 2</option>'; var sb=sid&&findSub(sid); if(!sb) return o;
  sb.topics.forEach(function(t){ if(!t.items.length) return;
    o+='<optgroup label="'+esc(t.name)+'">'+t.items.map(function(it){return '<option value="'+it.id+'"'+(sel===it.id?" selected":"")+'>'+esc(it.name)+'</option>';}).join("")+'</optgroup>';
  }); return o;
}
function logChart(f){
  var vals=[], max=0, i, lab=[];
  for(i=6;i>=0;i--){
    var ds=dayShift(-i), sec=0;
    (S.sessions||[]).forEach(function(x){if(x.date===ds&&logPass(x,f,false)) sec+=x.sec;});
    var d=dateParts(ds); vals.push({ds:ds,sec:sec,w:THDAY[d.getDay()],today:i===0}); if(sec>max) max=sec;
    lab.push((i===0?"วันนี้":THDAY[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1))+" "+Math.round(sec/60)+" นาที");
  }
  var h='<div class="lgchart" role="img" aria-label="เวลาอ่าน 7 วันล่าสุด: '+esc(lab.join(", "))+'">';
  vals.forEach(function(v){
    var ht=max?Math.max(v.sec?4:0,Math.round(v.sec/max*100)):0;
    h+='<div class="col'+(v.today?" today":"")+'" data-testid="lgbar" data-min="'+Math.round(v.sec/60)+'"><span class="v">'+(v.sec?Math.round(v.sec/60):"")+'</span><span class="bx"><i style="height:'+ht+'%"></i></span><span class="w">'+(v.today?"วันนี้":v.w)+'</span></div>';
  });
  return h+'</div>';
}
function logHtml(){
  var f=LG();

  var tot=0, days={}, byDay={}, order=[];

    '<div class="field"><label for="lgFilt">วิชา</label><select id="lgFilt" data-act="lg-filter-subj" data-fk="lg-filt">'+lgSubjOpts(f.subj,true)+'</select></div></div>'+
    '<p class="lgsum" data-testid="lg-sum">'+(list.length?'รวม <b>'+fmtDur(tot)+'</b> · '+list.length+' ครั้ง · '+nd+' วัน':'ไม่มีรายการอ่านในช่วงและวิชาที่เลือก')+'</p>'+
    logChart(f)+'<p class="hint" style="margin:0">กราฟแสดง 7 วันล่าสุดตามวิชาที่เลือก</p>';

    h+='<div class="lgday" data-testid="lgday"><div class="dh"><b>'+dayLabel(ds)+'</b><span>รวม '+fmtDur(dsec)+'</span></div><ul class="lgrows">';
    rows.forEach(function(x){
      h+='<li class="lgrow" data-testid="lgrow"><span class="tm2">'+timeText(x)+(x.paused?' <span class="pz" title="มีการหยุดชั่วคราวระหว่างอ่าน" aria-label="มีการหยุดชั่วคราว">⏸</span>':"")+'</span><span class="mn">'+fmtDur(x.sec)+'</span><span class="who2">'+esc(logWho(x))+(x.manual?' <span class="badge">เพิ่มเอง</span>':"")+'</span>'+
        '<span class="ac"><button class="btn sm" data-act="log-edit" data-id="'+x.id+'" data-fk="lge-'+x.id+'">แก้ไข</button><button class="btn sm danger" data-act="log-del" data-id="'+x.id+'" data-fk="lgd-'+x.id+'" aria-label="ลบรายการอ่าน '+esc(timeText(x))+'">ลบ</button></span></li>';
    });
    h+='</ul></div>';
  });
  return h+'</section>';
}
function readLogForm(m){
  var g=function(id){var e=document.getElementById(id); return e?e.value:null;};
  var v;
  if((v=g("lgDate"))!==null) m.date=v; if((v=g("lgTime"))!==null) m.time=v; if((v=g("lgMin"))!==null) m.min=v;
  if((v=g("lgSubj"))!==null) m.s=v||null;
  if((v=g("lgItem"))!==null) m.it=v||null;
}
function tpOfItem(sid,iid){var r=null, sb=findSub(sid); if(sb&&iid) sb.topics.forEach(function(t){t.items.forEach(function(i){if(i.id===iid) r=t.id;});}); return r;}
function logSave(m){
  readLogForm(m); var add=m.type==="log-add", fail=function(t){m.err=t; render();};
  var sid=m.s&&findSub(m.s)?m.s:null, iid=sid&&m.it&&tpOfItem(sid,m.it)?m.it:null, tid=iid?tpOfItem(sid,iid):null;
  if(add){
    if(!validDate(m.date)) return fail("เลือกวันที่ให้ถูกต้อง");
    var tm=/^(\d{2}):(\d{2})$/.exec(m.time||""); if(!tm||+tm[1]>23||+tm[2]>59) return fail("ใส่เวลาเริ่มให้ถูกต้อง");
    var ms=String(m.min==null?"":m.min).trim(); if(!/^\d+$/.test(ms)||+ms<1||+ms>720) return fail("จำนวนนาทีต้องเป็นจำนวนเต็ม 1–720");
    var a=m.date.split("-"), st=new Date(+a[0],+a[1]-1,+a[2],+tm[1],+tm[2]).getTime();
    if(st>Date.now()) return fail("เวลาเริ่มต้องไม่อยู่ในอนาคต");
    S.sessions.push({id:uid(),date:dateOf(st),sec:+ms*60,s:sid,tp:tid,it:iid,start:st,end:st+(+ms)*60000,manual:true,paused:false});
    save(); U.modal=null; render(); toast("เพิ่มรายการอ่านแล้ว");
  } else {
    var x=S.sessions.filter(function(q){return q.id===m.id;})[0];
    if(x){x.s=sid; x.tp=tid; x.it=iid; save();}
    U.modal=null; render(); toast("แก้ไขรายการแล้ว");
  }
}

var MTH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
var EMOJIS=["✅","📖","💪","🏃","💧","😴","🧘","✍️","🥗","🎯","🦷","🧹"];
function HM(){if(!U.hm){var n=new Date(); U.hm={y:n.getFullYear(),m:n.getMonth()};} return U.hm;}
function ymd(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d);}
function addDays(ds,n){var d=dateParts(ds); d.setHours(12); d.setDate(d.getDate()+n); return dateOf(d.getTime());}
function hbActive(){return (S.habits||[]).filter(function(h){return !h.archived;});}
function findHabit(id){return (S.habits||[]).filter(function(h){return h.id===id;})[0];}
function hbReq(h,ds){return h.days.indexOf(dateParts(ds).getDay())>=0;}
function hbFirst(h){var f=h.created; Object.keys(h.done).forEach(function(k){if(k<f) f=k;}); return f;}
function hbStreak(h){
  var today=todayStr(), first=hbFirst(h), d=today, n=0, g=0;
  while(d>=first&&g++<20000){
    if(h.done[d]) n++; else if(hbReq(h,d)&&d!==today) break;
    d=addDays(d,-1);
  }
  return n;
}
function hbBest(h){
  var today=todayStr(), d=hbFirst(h), cur=0, best=0, g=0;
  while(d<=today&&g++<20000){
    if(h.done[d]){cur++; if(cur>best) best=cur;} else if(hbReq(h,d)&&d!==today) cur=0;

function hbPct(h,y,m){
  var today=todayStr(), first=hbFirst(h), a=ymd(y,m,1), z=ymd(y,m,new Date(y,m+1,0).getDate());
  var d=a<first?first:a, end=z>today?today:z, num=0, den=0, g=0;
  while(d<=end&&g++<40){ if(hbReq(h,d)){den++; if(h.done[d]) num++;} d=addDays(d,1); }
  return den?Math.round(num/den*100):null;
}

(function restoreTimer(){
  if(T.status!=="running") return;
  var now=Date.now(); if(elapsedMs(now)<T.durMs) return;
  var endedAt=T.segStart+(T.durMs-T.accMs);
  var seen=Math.min(T.durMs,Math.max(0,T.accMs+(T.lastSeen-T.segStart)));
  if(endedAt-T.lastSeen<=2500) seen=T.durMs;
  if(T.phase==="read"&&seen<T.durMs) T.note="หน้าเว็บถูกปิดก่อนหมดเวลา จึงบันทึกเท่าที่เปิดอยู่";
  finishPhase(endedAt,T.phase==="read"?seen:0,seen<T.durMs?Math.max(T.lastSeen,T.phaseStart||0):endedAt);
})();

function initDraft(){U.draft=[]; for(var i=0;i<DRAFT_SLOTS;i++) U.draft.push({name:"",text:""});}
function parseDraft(text){
  var topics=[], cur=null;
  text.split(/\r?\n/).forEach(function(raw){
    if(!raw.trim()) return;
    var isSub=/^(\s*[-•*]|\t|\s{2,}\S)/.test(raw);
    var name=raw.replace(/^\s*[-•*]\s*/,"").trim(); if(!name) return;
    if(isSub&&cur) cur.items.push(name); else {cur={name:name,items:[]}; topics.push(cur);}
  });
  return topics;
}
function countText(text){
  var t=parseDraft(text), m=0; t.forEach(function(x){m+=x.items.length;});
  return t.length+" หัวข้อย่อย · "+m+" หัวข้อย่อย 2";
}

function buildSubjects(){
  var subs=[], first=S.stages[0].id;
  U.draft.forEach(function(d){
    var tps=parseDraft(d.text), name=d.name.trim();
    if(!name&&!tps.length) return;
    subs.push({id:uid(),name:name||("วิชา "+(subs.length+1)),topics:tps.map(function(t){
      return {id:uid(),name:t.name,items:t.items.map(function(n){return {id:uid(),name:n,stage:first,due:null};})};
    })});
  });
  return subs;

/* ---------- actions ---------- */

function closeModal(){U.modal=null; render();}
function modalOk(){

  } else if(m.type==="del-subj"){
    snapshot(); S.subjects=S.subjects.filter(function(s){return s.id!==m.id;}); S.sessions=S.sessions.filter(function(x){return x.s!==m.id;}); if(U.subj===m.id) U.subj="all"; save(); U.modal=null; render(); toast("ลบวิชาแล้ว",true);
  } else if(m.type==="del-topic"){
    snapshot(); var sub2=findSub(m.s); sub2.topics=sub2.topics.filter(function(t){return t.id!==m.tp;}); S.sessions=S.sessions.filter(function(x){return x.tp!==m.tp;}); save(); U.modal=null; render(); toast("ลบหัวข้อย่อยแล้ว",true);
  } else if(m.type==="del-stage"){
    var target=$("#modalSel").value; snapshot();
    S.subjects.forEach(function(s){s.topics.forEach(function(t){t.items.forEach(function(it){if(it.stage===m.id) it.stage=target;});});});
    removeStage(m.id); U.modal=null; render(); toast("ลบขั้นตอนและย้ายหัวข้อย่อย 2 แล้ว",true);
  } else if(m.type==="habit"){
    habitSave(m);
  } else if(m.type==="hb-del"){
    snapshot(); S.habits=S.habits.filter(function(x){return x.id!==m.id;}); save(); U.modal=null; render(); toast("ลบ Habit แล้ว",true);
  } else if(m.type==="log-add"||m.type==="log-edit"){
    logSave(m);
  } else if(m.type==="tm-reset"){
    resetTimer(); U.modal=null; render();
  } else if(m.type==="reset"){
    var scope=$("#modalSel").value;
    if(scope==="habit"){S.habits=[]; save(); U.modal=null; render(); toast("ล้าง Habit ทั้งหมดแล้ว");}
    else{
      var keepH=scope==="study"?S.habits:[]; S=fresh(); S.habits=keepH; T=freshT(); saveT();
      U={sec:"study",view:"setup",subj:"all",filter:"all",near:false,fold:{},modal:null,draft:null}; setHash("study");
      if(keepH.length) save(); else {try{localStorage.removeItem(KEY);}catch(e){delete mem[KEY];}}
      render(); toast("ล้างข้อมูลแล้ว");
    }
  }
}
function removeStage(id){
  S.stages=S.stages.filter(function(s){return s.id!==id;});
  if(!S.stages.some(function(s){return s.done;})) S.stages[S.stages.length-1].done=true;
  if(U.filter===id) U.filter="all";
  save();
}
function importNow(){
  var txt=($("#importText").value||"").trim();
  if(!txt){toast("วางข้อมูลหรือเลือกไฟล์ก่อน");return;}
  try{
    var o=JSON.parse(txt), n=normalize(o); if(!Array.isArray(o.habits)) n.habits=S.habits; snapshot(); S=n; U.subj="all"; U.filter="all"; U.near=false; save(); U.view="overview"; U.sec="study"; setHash("study"); render(); toast("นำเข้าข้อมูลแล้ว",true);
  }catch(e){toast("นำเข้าไม่ได้: "+(typeof e==="string"?e:"รูปแบบข้อมูลไม่ถูกต้อง"));}
}
document.addEventListener("click",function(e){

  var a=b.dataset.act, d=b.dataset;
  if(a==="scrim"){ if(e.target===b) closeModal(); return; }

  case "nav": U.view=d.v; U.sec="study"; render(); break;
  case "go-stage": U.view="topics"; U.subj="all"; U.filter=d.st; U.near=false; render(); break;
  case "go-near": U.view="topics"; U.subj="all"; U.filter="all"; U.near=true; render(); break;
  case "open-subj": U.view="topics"; U.subj=d.s; U.filter="all"; U.near=false; render(); window.scrollTo(0,0); break;
  case "pick-subj": U.subj=d.s; render(); break;
  case "filter": U.filter=d.st; render(); break;
  case "filter-near": U.near=!U.near; render(); break;
  case "fold": U.fold[d.tp]=!U.fold[d.tp]; render(); break;
  case "set-stage": var it=findItem(d.s,d.tp,d.it); if(it){it.stage=d.st; save(); render();} break;
  case "add-topic": addTopic(d.s); break;
  case "add-item": addItem(d.s,d.tp); break;
  case "del-item":
    snapshot(); var tp=findTopic(d.s,d.tp); tp.items=tp.items.filter(function(x){return x.id!==d.it;}); S.sessions=S.sessions.filter(function(x){return x.it!==d.it;}); save(); render(); toast("ลบหัวข้อย่อย 2 แล้ว",true); break;
  case "del-topic":
    var tp2=findTopic(d.s,d.tp);
    if(tp2.items.length){U.modal={type:"del-topic",s:d.s,tp:d.tp}; render();}
    else {snapshot(); var sb=findSub(d.s); sb.topics=sb.topics.filter(function(t){return t.id!==d.tp;}); S.sessions=S.sessions.filter(function(x){return x.tp!==d.tp;}); save(); render(); toast("ลบหัวข้อย่อยแล้ว",true);} break;
  case "add-subj": U.modal={type:"add-subj"}; render(); break;
  case "del-subj": U.modal={type:"del-subj",id:d.s}; render(); break;
  case "modal-cancel": closeModal(); break;
  case "modal-ok": modalOk(); break;
  case "undo": if(undoSnap){S=JSON.parse(undoSnap); undoSnap=null; save(); $("#toast").hidden=true; render();} break;
  case "stage-color": S.stages.forEach(function(s){if(s.id===d.st) s.color=+d.k;}); save(); render(); break;
  case "stage-add":
    var used={}; S.stages.forEach(function(s){used[s.color]=1;}); var col=S.stages.length%8; for(var k=0;k<8;k++){if(!used[k]){col=k;break;}}
    S.stages.push({id:uid(),name:"ขั้นตอนใหม่",color:col,done:false}); save(); render(); break;
  case "stage-up": case "stage-down":
    var i=S.stages.map(function(s){return s.id;}).indexOf(d.st), j=a==="stage-up"?i-1:i+1;
    if(j<0||j>=S.stages.length) break;
    var tmp=S.stages[i]; S.stages[i]=S.stages[j]; S.stages[j]=tmp; save(); render(); break;
  case "stage-del":
    if(S.stages.length<=2){toast("ต้องมีอย่างน้อย 2 ขั้นตอน ลบอีกไม่ได้");break;}
    var cnt=allItems().filter(function(t){return t.stage===d.st;}).length;
    if(cnt>0){U.modal={type:"del-stage",id:d.st,count:cnt}; render();}
    else {snapshot(); removeStage(d.st); render(); toast("ลบขั้นตอนแล้ว",true);} break;
  case "copy":
    var ta=$("#exportText"), txt=ta.value;
    var fallback=function(){ta.focus(); ta.select(); toast("เลือกข้อมูลไว้แล้ว กด Ctrl+C (หรือกดค้างแล้วเลือกคัดลอก)");};
    try{ navigator.clipboard.writeText(txt).then(function(){toast("คัดลอกข้อมูลแล้ว");},fallback);}catch(err){fallback();} break;
  case "download":
    try{
      var blob=new Blob([exportJson()],{type:"application/json"}), url=URL.createObjectURL(blob), l=document.createElement("a");
      l.href=url; l.download="study-tracker-backup.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast("เริ่มดาวน์โหลดแล้ว ถ้าไม่ขึ้นให้ใช้ปุ่มคัดลอกข้อมูลแทน");
    }catch(err){toast("ดาวน์โหลดไม่ได้ ใช้ปุ่มคัดลอกข้อมูลแทน");} break;
  case "import": importNow(); break;
  case "reset": U.modal={type:"reset"}; render(); break;
  case "lg-range": LG().range=d.r; render(); break;
  case "log-add": U.modal={type:"log-add",date:todayStr(),time:"",min:"",s:LG().subj!=="all"&&LG().subj!=="none"?LG().subj:null,it:null}; render(); break;
  case "log-edit":
    var lx=S.sessions.filter(function(q){return q.id===d.id;})[0];
    if(lx){U.modal={type:"log-edit",id:lx.id,s:lx.s,it:lx.it}; render();} break;
  case "log-del":
    snapshot(); S.sessions=S.sessions.filter(function(q){return q.id!==d.id;}); save(); render(); toast("ลบรายการอ่านแล้ว",true); break;
  case "go": goSec(d.sec); break;
  case "hb-prev": case "hb-next":
    var hm=HM(), nm2=hm.y*12+hm.m+(a==="hb-prev"?-1:1), nw=new Date();
    if(nm2>nw.getFullYear()*12+nw.getMonth()) break;
    U.hm={y:Math.floor(nm2/12),m:nm2%12}; U.hbScroll=null; render(); break;
  case "hb-today": U.hm=null; U.hbScroll=null; render(); break;
  case "hb-add": U.modal={type:"habit",id:null,name:"",emoji:"✅",color:1,days:[0,1,2,3,4,5,6]}; render(); break;
  case "hb-edit": var he=findHabit(d.id); if(he){U.modal={type:"habit",id:he.id,name:he.name,emoji:he.emoji,color:he.color,days:he.days.slice()}; render();} break;
  case "hb-emoji": readHabitForm(U.modal); U.modal.emoji=d.e; U.modal.err=null; render(); break;
  case "hb-color": readHabitForm(U.modal); U.modal.color=+d.k; render(); break;
  case "hb-days": readHabitForm(U.modal); U.modal.days=d.p==="all"?[0,1,2,3,4,5,6]:d.p==="wk"?[1,2,3,4,5]:[0,6]; U.modal.err=null; render(); break;
  case "hb-toggle":
    var ht=findHabit(d.id); if(ht&&d.d<=todayStr()){ if(ht.done[d.d]) delete ht.done[d.d]; else ht.done[d.d]=1; save(); render(); } break;
  case "hb-archive": var ha=findHabit(d.id); if(ha){snapshot(); ha.archived=true; save(); U.modal=null; render(); toast("เก็บถาวร \""+ha.name+"\" แล้ว",true);} break;
  case "hb-restore": var hr=findHabit(d.id); if(hr){hr.archived=false; save(); render(); toast("กู้คืน \""+hr.name+"\" แล้ว");} break;
  case "hb-del-ask": if(findHabit(d.id)){U.modal={type:"hb-del",id:d.id}; render();} break;
  case "tm-start": startPhase("read"); render(); break;
  case "tm-toggle":
    var tn=Date.now();
    if(T.status==="running"){T.accMs=elapsedMs(tn); T.segStart=null; T.status="paused"; T.paused=true;}
    else if(T.status==="paused"){T.segStart=tn; T.status="running"; T.lastSeen=tn;}
    saveT(); render(); break;
  case "tm-end": finishPhase(Date.now(),elapsedMs(Date.now())); break;
  case "tm-skip": finishPhase(Date.now(),0); break;
  case "tm-next":
    if(T.phase==="read"){var nx=T.next||"short"; if(nx==="long") T.round=0; startPhase(nx);} else startPhase("read");
    render(); break;
  case "tm-reset":
    var tr=Date.now();
    if(T.phase==="read"&&(T.status==="running"||T.status==="paused")&&elapsedMs(tr)>=1000){U.modal={type:"tm-reset",sec:Math.floor(elapsedMs(tr)/1000)}; render();}
    else resetTimer();
    break;
  case "draft-add": U.draft.push({name:"",text:""}); render(); break;
  case "draft-del": U.draft.splice(+d.i,1); render(); break;
  case "finish-setup": S.subjects=buildSubjects(); S.setup=true; U.view="overview"; U.draft=null; save(); render(); toast("พร้อมใช้งานแล้ว เพิ่มและแก้ไขได้ในแท็บ \"หัวข้อ\""); break;
  case "skip-setup": S.subjects=[]; S.setup=true; U.view="overview"; U.draft=null; save(); render(); toast("เริ่มแบบว่างแล้ว เพิ่มวิชาได้ที่ปุ่ม \"เพิ่มวิชาแรก\""); break;
